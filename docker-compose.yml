version: "3.8"

services:
  qbittorrent:
    image: lscr.io/linuxserver/qbittorrent:latest
    container_name: qbittorrent
    environment:
      - PUID=1000
      - PGID=1000
      - TZ=Etc/UTC
      - WEBUI_PORT=8089
      - TORRENTING_PORT=51007
    volumes:
      - ./qbit-config:/config
      - ./downloads:/downloads
    ports:
      - "8089:8089"
      - "51007:51007"
      - "51007:51007/udp"
      - "6881:51007"
      - "6881:51007/udp"
    restart: unless-stopped

  prowlarr:
    image: lscr.io/linuxserver/prowlarr:latest
    container_name: prowlarr
    environment:
      - PUID=1000
      - PGID=1000
      - TZ=Etc/UTC
    volumes:
      - ./prowlarr-config:/config
    ports:
      - "9696:9696"
    restart: unless-stopped

  api:
    build: .
    container_name: fastapi-qbit
    environment:
      - PROJECT_NAME=FastAPI qBittorrent API
      - SERVER_HOST=0.0.0.0
      - SERVER_PORT=8000
      - API_V1_STR=/api/v1
      - QBIT_HOST=qbittorrent
      - QBIT_PORT=8089
      - QBIT_USERNAME=admin
      - QBIT_PASSWORD=adminadmin
      - DEFAULT_SAVE_PATH=/downloads/
      - OAUTHLIB_RELAX_TOKEN_SCOPE=1
      - PROWLARR_URL=http://prowlarr:9696
    volumes:
      - ./downloads:/downloads:ro
      - ./credentials.json:/app/credentials.json:ro
      - ./token.json:/app/token.json
      - ./gdrive_settings.json:/app/gdrive_settings.json
      - ./prowlarr_settings.json:/app/prowlarr_settings.json
    ports:
      - "8000:8000"
    depends_on:
      - qbittorrent
      - prowlarr
    restart: unless-stopped

