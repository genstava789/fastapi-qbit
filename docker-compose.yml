version: "3.8"

services:
  qbittorrent:
    image: lscr.io/linuxserver/qbittorrent:latest
    container_name: qbittorrent
    environment:
      - PUID=1000
      - PGID=1000
      - TZ=Etc/UTC
      - WEBUI_PORT=8089
      - TORRENTING_PORT=6881
    volumes:
      - ./qbit-config:/config
      - ./downloads:/downloads
    ports:
      - "8089:8089"
      - "6881:6881"
      - "6881:6881/udp"
    restart: unless-stopped

  api:
    build: .
    container_name: fastapi-qbit
    environment:
      - PROJECT_NAME=FastAPI qBittorrent API
      - SERVER_HOST=0.0.0.0
      - SERVER_PORT=8000
      - API_V1_STR=/api/v1
      - QBIT_HOST=qbittorrent
      - QBIT_PORT=8089
      - QBIT_USERNAME=admin
      - QBIT_PASSWORD=adminadmin
      - DEFAULT_SAVE_PATH=/downloads/
    ports:
      - "8000:8000"
    depends_on:
      - qbittorrent
    restart: unless-stopped

